databases:
  FRS:
    url: https://ordsext.epa.gov/FLA/www3/state_files/national_combined.zip
    # link to url: https://www.epa.gov/frs/epa-state-combined-csv-download-files
    archive_file_name: 'national_combined.zip'
    FRS_bridge_file: 'NATIONAL_ENVIRONMENTAL_INTEREST_FILE.CSV'
    FRS_NAICS_file: 'NATIONAL_NAICS_FILE.CSV'
    FRS_facility_file: 'NATIONAL_FACILITY_FILE.CSV'
    FRS_program_file: 'NATIONAL_PROGRAM_FILE.CSV'
    program_dictionary:
        NEI: 'EIS'
        TRI: 'TRIS'
        eGRID: 'EGRID'
        GHGRP: 'E-GGRT'
        RCRAInfo: 'RCRAINFO'
        DMR: 'NPDES'
    # One site can hold more than one FRS registry record, which leaves the
    # programs registered under each of them unmatched. See colocation.py.
    colocation:
        enabled: true
        address_max_km: 5
        name_max_km: 1
        max_block_size: 40
        max_cluster_size: 12
    # Two programs reporting the same quantity at the same place are the same
    # facility. Needs the inventories themselves, so a comparison whose
    # inventory-years are not on hand is skipped. See quantity.py.
    quantity_matching:
        enabled: true
        tolerance: 0.005
        max_km: 10
        min_quantity: 25000000
        comparisons:
          - inventories: ['GHGRP', 'NEI']
            flow: 'Carbon Dioxide'
            years: [2021, 2022]
